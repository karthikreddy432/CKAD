
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: "CKAD Quick-Read Notes" }}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: #24292f;
      background: #ffffff;
    }

    h1, h2, h3, h4 {
      line-height: 1.3;
      margin-top: 1.5em;
    }

    h1 {
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 10px;
    }

    h2 {
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 8px;
    }

    a {
      color: #0969da;
    }

    pre {
      overflow-x: auto;
      padding: 16px;
      background: #f6f8fa;
      border-radius: 8px;
      line-height: 1.5;
    }

    code {
      font-family: Consolas, Monaco, monospace;
    }

    p code, li code, td code {
      background: #f0f0f0;
      padding: 2px 5px;
      border-radius: 4px;
    }

    table {
      display: block;
      overflow-x: auto;
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #d0d7de;
      padding: 8px 12px;
      text-align: left;
    }

    th {
      background: #f6f8fa;
    }

    blockquote {
      border-left: 4px solid #0969da;
      margin-left: 0;
      padding-left: 16px;
      color: #57606a;
    }

    img, svg {
      max-width: 100%;
      height: auto;
    }

    .mermaid {
      width: 100%;
      overflow-x: auto;
      margin: 25px 0;
      padding: 15px;
      text-align: center;
      background: #ffffff;
    }

    .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    .mermaid-error {
      color: #cf222e;
      padding: 12px;
      border: 1px solid #cf222e;
      border-radius: 6px;
    }

    details {
      margin: 12px 0;
      padding: 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        margin: 12px auto;
        padding: 0 14px;
        font-size: 15px;
      }

      h1 {
        font-size: 1.7em;
      }

      h2 {
        font-size: 1.4em;
      }

      .mermaid {
        padding: 5px;
      }
    }
  </style>
</head>

<body>

  {{ content }}

  <script type="module">
    import mermaid from
      'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'strict',
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true
      }
    });

    // Find Mermaid code blocks generated by Jekyll.
    const blocks = document.querySelectorAll(
      'pre code.language-mermaid, ' +
      'pre code.lang-mermaid, ' +
      'code.language-mermaid, ' +
      '.language-mermaid'
    );

    blocks.forEach(block => {
      if (block.closest('.mermaid')) return;

      const code = block.matches('code')
        ? block
        : block.querySelector('code') || block;

      const pre = block.closest('pre');
      const source = code.textContent.trim();

      if (!source) return;

      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = source;

      (pre || block).replaceWith(diagram);
    });

    // Render all Mermaid diagrams.
    try {
      await mermaid.run({
        querySelector: '.mermaid'
      });
    } catch (error) {
      console.error('Mermaid rendering failed:', error);
    }
  </script>

</body>
</html>
